name: Mise à jour quotidienne Érosion Gironde

on:
  schedule:
    # Exécution automatique chaque matin à 05h30 UTC (06h30 heure d'hiver / 07h30 heure d'été à Paris)
    - cron: '30 5 * * *'
  workflow_dispatch: # Permet de lancer la mise à jour manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      - name: Exécution du calcul météo-marin et alertes
        env:
          SHOM_API_KEY: ${{ secrets.SHOM_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_SMS_TO: ${{ secrets.ALERT_SMS_TO }}
        run: python update_coastal_data.py

      - name: Sauvegarde de data_littoral.json dans le dépôt
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin main
          git reset --soft origin/main
          git add data_littoral.json
          if ! git diff --staged --quiet; then
            git commit -m "Mise à jour prévisions 7j littoral girondin"
            git push origin main
          fi
