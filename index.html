<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Érosion Littorale Gironde — Prévisions 7 jours</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #0f172a; color: #f8fafc; }
    header { background: #1e293b; padding: 10px 16px; border-bottom: 1px solid #334155; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
    header h1 { font-size: 1.05rem; font-weight: 700; color: #38bdf8; }
    header p { font-size: 0.76rem; color: #94a3b8; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; background: #0f172a; border-bottom: 1px solid #1e293b; }
    .btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: 0.78rem; white-space: nowrap; }
    .btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: 600; }
    .btn-zoom.active { background: #0d9488; border-color: #2dd4bf; color: #fff; }
    .main-container { display: flex; flex: 1; overflow: hidden; }
    .map-wrapper { flex: 1; position: relative; background: #0c4a6e; overflow: hidden; cursor: grab; }
    .map-wrapper:active { cursor: grabbing; }
    #coast-map { width: 100%; height: 100%; }
    .zoom-controls { position: absolute; bottom: 14px; left: 14px; display: flex; gap: 6px; z-index: 10; }
    .zoom-controls button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; font-size: 1.1rem; cursor: pointer; }
    .sidebar { width: 375px; background: #1e293b; border-left: 1px solid #334155; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .legend { display: flex; gap: 12px; font-size: 0.76rem; background: #0f172a; padding: 7px 12px; border-radius: 8px; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #22c55e; }
    .dot-blue { background: #38bdf8; animation: pulseDot 1.1s infinite; }
    .dot-red { background: #ef4444; animation: pulseDot 0.9s infinite; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 14px; }
    .card h2 { font-size: 1rem; margin-bottom: 6px; color: #f8fafc; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; margin-bottom: 8px; }
    .badge-safe { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid #22c55e; }
    .badge-cut { background: rgba(56,189,248,0.18); color: #38bdf8; border: 1px solid #0284c7; }
    .badge-dune { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid #ef4444; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .metric { background: #1e293b; padding: 8px 10px; border-radius: 6px; }
    .metric label { display: block; font-size: 0.68rem; color: #94a3b8; }
    .metric strong { font-size: 0.9rem; color: #f1f5f9; }
    .profile-box { margin-top: 10px; background: #1e293b; border-radius: 8px; padding: 10px; }
    @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(1.3); } }
    @keyframes svgPulse { 0% { opacity: 0.95; } 50% { opacity: 0.1; } 100% { opacity: 0.95; } }
    .pulse-ring { animation: svgPulse 1s infinite ease-in-out; }
    .plage-point { cursor: pointer; }
    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .map-wrapper { height: 52vh; }
      .sidebar { width: 100%; height: 48vh; border-left: none; border-top: 1px solid #334155; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Vigilance Érosion — Littoral Girondin (28 Secteurs)</h1>
      <p id="update-info">Synchronisation en cours...</p>
    </div>
    <div class="legend">
      <span><i class="dot dot-green"></i> Stable</span>
      <span><i class="dot dot-blue"></i> Cut d'estran</span>
      <span><i class="dot dot-red"></i> Attaque dune</span>
    </div>
  </header>

  <div class="toolbar" id="date-bar"></div>
  <div class="toolbar" id="zoom-bar"></div>

  <div class="main-container">
    <div class="map-wrapper" id="map-wrapper">
      <svg id="coast-map" viewBox="0 0 420 650" preserveAspectRatio="xMidYMid meet">
        <rect x="-200" y="-200" width="820" height="1050" fill="#0c4a6e" />
        <text x="16" y="300" fill="#38bdf8" opacity="0.28" font-size="14" font-weight="700" letter-spacing="2">OCÉAN ATLANTIQUE</text>
        <text x="195" y="42" fill="#7dd3fc" opacity="0.6" font-size="10" font-weight="600">Estuaire de la Gironde</text>
        <path d="M 192,48 L 225,52 L 420,170 L 420,650 L 118,650 L 122,535 L 138,500 L 155,495 L 185,510 L 210,495 L 205,460 L 175,450 L 145,470 L 136,498 L 130,470 L 145,355 L 160,245 L 175,135 L 186,65 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
        <ellipse cx="182" cy="195" rx="9" ry="26" fill="#0284c7" opacity="0.55" />
        <ellipse cx="174" cy="285" rx="7" ry="15" fill="#0284c7" opacity="0.55" />
        <path d="M 145,470 Q 175,450 205,460 Q 210,495 185,510 Q 155,495 145,470 Z" fill="#0284c7" opacity="0.7" />
        <text x="150" y="487" fill="#e0f2fe" font-size="8.5" font-weight="600">Bassin d'Arcachon</text>
        <ellipse cx="152" cy="580" rx="8" ry="16" fill="#0284c7" opacity="0.55" />
        <g id="markers-group"></g>
      </svg>
      <div class="zoom-controls">
        <button onclick="zoomStep(0.75)" title="Zoomer">+</button>
        <button onclick="zoomStep(1.33)" title="Dézoomer">−</button>
        <button onclick="setViewBox(0, 0, 420, 650, 'global')" title="Vue globale">↺</button>
      </div>
    </div>
    <aside class="sidebar">
      <div class="card" id="detail-card">
        <h2>Sélectionnez une plage</h2>
        <p style="font-size:0.84rem;color:#94a3b8;">Cliquez sur un point de la carte pour consulter le diagnostic.</p>
      </div>
    </aside>
  </div>

    <script>
    const P = {
      verdon: { n: "Le Verdon (Pointe de Grave)", s: "Pointe de Grave", f: "verdon", la: 45.568, lo: -1.085, b: 2.90, d: 4.20 },
      soulac: { n: "Soulac-sur-Mer", s: "Soulac", f: "soulac", la: 45.515, lo: -1.132, b: 2.85, d: 4.10 },
      "amélie": { n: "Soulac (L'Amélie)", s: "L'Amélie", f: "amélie", la: 45.485, lo: -1.142, b: 2.85, d: 4.15 },
      montalivet: { n: "Vendays-Montalivet", s: "Montalivet", f: "montalivet", la: 45.378, lo: -1.161, b: 3.00, d: 4.45 },
      hourtin: { n: "Hourtin Plage", s: "Hourtin", f: "hourtin", la: 45.221, lo: -1.178, b: 3.10, d: 4.70 },
      carcans: { n: "Carcans Plage", s: "Carcans", f: "carcans", la: 45.085, lo: -1.192, b: 3.15, d: 4.80 },
      lacanau_lion: { n: "Lacanau — Le Lion", s: "Le Lion", f: "lacanau", la: 45.035, lo: -1.196, b: 3.10, d: 4.70 },
      lacanau_nord: { n: "Lacanau — Plage Nord", s: "Lacanau Nord", f: "lacanau", la: 45.016, lo: -1.199, b: 3.05, d: 4.60 },
      lacanau_centrale: { n: "Lacanau — Plage Centrale", s: "Lacanau Centrale", f: "lacanau", la: 45.002, lo: -1.201, b: 3.00, d: 4.55 },
      lacanau_sud: { n: "Lacanau — Plage Sud", s: "Lacanau Sud", f: "lacanau", la: 44.991, lo: -1.203, b: 3.05, d: 4.65 },
      lacanau_ecureuils: { n: "Lacanau — Les Écureuils", s: "Les Écureuils", f: "lacanau", la: 44.978, lo: -1.205, b: 3.10, d: 4.75 },
      lacanau_supersud: { n: "Lacanau — Super Sud", s: "Super Sud", f: "lacanau", la: 44.962, lo: -1.208, b: 3.15, d: 4.85 },
      lacanau_alexandre: { n: "Lacanau — La Alexandre", s: "La Alexandre", f: "lacanau", la: 44.938, lo: -1.211, b: 3.18, d: 4.95 },
      porge_gressier: { n: "Le Porge — Le Gressier", s: "Le Gressier", f: "leporge", la: 44.915, lo: -1.212, b: 3.20, d: 5.00 },
      porge_centrale: { n: "Le Porge — Plage Centrale", s: "Le Porge Centrale", f: "leporge", la: 44.892, lo: -1.215, b: 3.20, d: 5.05 },
      porge_jenny: { n: "Le Porge — La Jenny", s: "La Jenny", f: "leporge", la: 44.862, lo: -1.219, b: 3.18, d: 4.95 },
      grand_crohot: { n: "Lège — Le Grand Crohot", s: "Grand Crohot", f: "lege", la: 44.812, lo: -1.226, b: 3.15, d: 4.90 },
      truc_vert: { n: "Cap Ferret — Le Truc Vert", s: "Truc Vert", f: "lege", la: 44.738, lo: -1.239, b: 3.10, d: 4.75 },
      garonne: { n: "Cap Ferret — La Garonne", s: "La Garonne", f: "lege", la: 44.705, lo: -1.245, b: 3.05, d: 4.65 },
      torchere: { n: "Cap Ferret — La Torchère", s: "La Torchère", f: "lege", la: 44.675, lo: -1.251, b: 3.00, d: 4.55 },
      horizon: { n: "Cap Ferret — L'Horizon", s: "L'Horizon", f: "lege", la: 44.645, lo: -1.256, b: 2.95, d: 4.50 },
      dunes_ferret: { n: "Cap Ferret — Les Dunes", s: "Les Dunes", f: "lege", la: 44.622, lo: -1.254, b: 2.90, d: 4.40 },
      pointe_ferret: { n: "Cap Ferret — La Pointe", s: "La Pointe", f: "lege", la: 44.602, lo: -1.248, b: 2.80, d: 4.25 },
      petit_nice: { n: "Pyla-sur-Mer — Le Petit Nice", s: "Le Petit Nice", f: "pilat", la: 44.572, lo: -1.226, b: 2.80, d: 4.25 },
      la_lagune: { n: "Pyla-sur-Mer — La Lagune", s: "La Lagune", f: "pilat", la: 44.552, lo: -1.233, b: 2.85, d: 4.35 },
      salie_nord: { n: "La Teste — La Salie Nord", s: "La Salie Nord", f: "pilat", la: 44.532, lo: -1.240, b: 2.90, d: 4.40 },
      salie_sud: { n: "La Teste — La Salie Sud", s: "La Salie Sud", f: "pilat", la: 44.512, lo: -1.245, b: 2.95, d: 4.45 },
      biscarrosse: { n: "Biscarrosse Plage", s: "Biscarrosse", f: "biscarrosse", la: 44.448, lo: -1.254, b: 3.05, d: 4.60 }
    };
    const Z = Array.of(
      { id: "global", l: "Vue globale", v: "0 0 420 650" },
      { id: "medoc", l: "Nord Médoc", v: "90 35 230 155" },
      { id: "lacanau", l: "Lacanau (7)", v: "75 262 195 105" },
      { id: "porge", l: "Le Porge (3)", v: "70 325 195 95" },
      { id: "ferret", l: "Cap Ferret (7)", v: "55 385 205 140" },
      { id: "pyla", l: "Pyla & Salie (4)", v: "65 475 195 100" },
      { id: "bisca", l: "Biscarrosse", v: "65 535 195 100" }
    );
    let B = {}, D = Array.of(), day = 0, sel = "lacanau_centrale", zid = "global", vb = { x: 0, y: 0, w: 420, h: 650 };
    function setViewBox(x, y, w, h, id) { vb = { x, y, w, h }; document.getElementById('coast-map').setAttribute('viewBox', `${x} ${y} ${w} ${h}`); if (id) { zid = id; drawZoom(); } drawPts(); }
    function zoomStep(f) { const nw = Math.max(65, Math.min(420, vb.w * f)), nh = Math.max(95, Math.min(650, vb.h * f)); setViewBox(vb.x + (vb.w - nw)/2, vb.y + (vb.h - nh)/2, nw, nh, null); }
    function getD(k, i) { const m = P[k], fk = Object.keys(B).slice(0,1).pop(), lk = B[k] ? k : (m && B[m.f] ? m.f : fk), a = B[lk] || Array.of(); return a.slice(i, i+1).pop() || a.slice(0,1).pop() || { hs: 1.8, tp: 10.5, waveDir: 280, wind: 20, coeff: 60, totalWater: 3.1, effectivePower: 35, status: "safe" }; }
    function drawZoom() { const b = document.getElementById('zoom-bar'); b.innerHTML = ''; Z.forEach(z => { const bt = document.createElement('button'); bt.className = 'btn btn-zoom' + (z.id === zid ? ' active' : ''); bt.textContent = z.l; bt.onclick = () => { const p = z.v.split(' ').map(Number); setViewBox(p.slice(0,1).pop(), p.slice(1,2).pop(), p.slice(2,3).pop(), p.slice(3,4).pop(), z.id); }; b.appendChild(bt); }); }
    function drawDates() { const b = document.getElementById('date-bar'); b.innerHTML = ''; D.forEach((d, i) => { const bt = document.createElement('button'); bt.className = 'btn' + (i === day ? ' active' : ''); const dt = new Date(d + 'T12:00:00'); bt.textContent = i === 0 ? "Aujourd'hui" : (isNaN(dt) ? d : dt.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' })); bt.onclick = () => { day = i; drawDates(); drawPts(); drawDet(sel); }; b.appendChild(bt); }); }
        function drawPts() {
      const ns = "http" + "://www.w3.org" + "/2000/svg";
      const g = document.getElementById('markers-group'); g.innerHTML = ''; const sc = vb.w / 420, rb = Math.max(1.7, 5*sc), fs = Math.max(3.4, 8.5*sc);
      Object.keys(P).forEach(k => {
        const m = P[k], pv = getD(k, day), x = Math.round((120 + ((m.lo + 1.28)/0.23)*80)*10)/10, y = Math.round((55 + ((45.58 - m.la)/1.16)*555)*10)/10;
        const isD = pv.duneAttack || pv.status === 'dune', isC = !isD && (pv.cutEstran || pv.status === 'cut'), col = isD ? '#ef4444' : (isC ? '#38bdf8' : '#22c55e'), isS = k === sel;
        const gr = document.createElementNS(ns, 'g'); gr.setAttribute('class', 'plage-point'); gr.onclick = () => { sel = k; drawPts(); drawDet(k); };
        if (isD || isC) { const rg = document.createElementNS(ns, 'circle'); rg.setAttribute('cx', x); rg.setAttribute('cy', y); rg.setAttribute('r', rb*2.2); rg.setAttribute('fill', col); rg.setAttribute('class', 'pulse-ring'); gr.appendChild(rg); }
        const c = document.createElementNS(ns, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', isS ? rb*1.35 : rb); c.setAttribute('fill', col); c.setAttribute('stroke', isS ? '#facc15' : '#fff'); c.setAttribute('stroke-width', Math.max(0.5, 1.3*sc)); gr.appendChild(c);
        const t = document.createElementNS(ns, 'text'); t.setAttribute('x', x + rb*1.8); t.setAttribute('y', y + fs*0.35); t.setAttribute('fill', isS ? '#facc15' : '#f1f5f9'); t.setAttribute('font-size', fs); t.setAttribute('font-weight', isS ? '700' : '500'); t.textContent = m.s; gr.appendChild(t);
        g.appendChild(gr);
      });
    }
    function drawDet(k) {
      sel = P[k] ? k : "lacanau_centrale"; const m = P[sel], pv = getD(sel, day), isD = pv.duneAttack || pv.status === 'dune', isC = !isD && (pv.cutEstran || pv.status === 'cut');
      let bg = `<span class="badge badge-safe">Profil stable</span>`, dg = "Houle et niveau d'eau sous les seuils critiques.";
      if (isC) { bg = `<span class="badge badge-cut">🔵 Risque de CUT d'estran</span>`; dg = `Puissance effective (${pv.effectivePower} kW/m, houle + vent) : risque d'entaille sur la berme (+${m.b}m NGF).`; }
      else if (isD) { bg = `<span class="badge badge-dune">🔴 ALERTE ATTAQUE PIED DE DUNE</span>`; dg = `Niveau d'eau max (+${pv.totalWater}m NGF) atteignant le pied de dune (+${m.d}m NGF).`; }
      const wy = Math.max(20, Math.min(110, 115 - pv.totalWater*16)), by = 115 - m.b*16, dy = 115 - m.d*16;
      document.getElementById('detail-card').innerHTML = `<h2>${m.n}</h2>${bg}<p style="font-size:0.82rem;color:#cbd5e1;line-height:1.4;">${dg}</p><div class="grid"><div class="metric"><label>Houle (Hs / Tp)</label><strong>${pv.hs} m / ${pv.tp} s</strong></div><div class="metric"><label>Dir. Houle / Vent</label><strong>${pv.waveDir}° / ${pv.wind} km/h</strong></div><div class="metric"><label>Coeff. Marée</label><strong>${pv.coeff}</strong></div><div class="metric"><label>Niveau d'eau max</label><strong>+${pv.totalWater} m NGF</strong></div><div class="metric"><label>Cote Berme</label><strong>+${m.b} m NGF</strong></div><div class="metric"><label>Pied de Dune</label><strong>+${m.d} m NGF</strong></div></div><div class="profile-box"><svg viewBox="0 0 300 130" style="width:100%;height:130px;"><rect x="0" y="${wy}" width="300" height="${130-wy}" fill="rgba(56,189,248,0.35)" /><line x1="0" y1="${wy}" x2="260" y2="${wy}" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" /><polygon points="0,125 140,${by} 220,${dy} 260,15 300,15 300,130 0,130" fill="#d97706" opacity="0.85" /><text x="85" y="${by-6}" fill="#38bdf8" font-size="9">Berme +${m.b}m</text><text x="155" y="${dy-6}" fill="#f87171" font-size="9">Dune +${m.d}m</text><text x="8" y="${wy-4}" fill="#7dd3fc" font-size="9">Eau +${pv.totalWater}m</text></svg></div>`;
    }
    const td = new Date(); D = Array.from({length:7}, (_,i) => { const d = new Date(td); d.setDate(td.getDate()+i); return d.toISOString().slice(0,10); });
    drawZoom(); drawDates(); drawPts(); drawDet(sel);
    fetch('data_littoral.json?t=' + Date.now()).then(r => r.ok ? r.json() : null).then(raw => {
      if (raw && raw.beaches) { B = raw.beaches; const fk = Object.keys(B).slice(0,1).pop(); if (fk && Array.isArray(B[fk])) D = B[fk].map(x => x.date); document.getElementById('update-info').textContent = `Mise à jour : ${raw.updated_at || 'OK'}`; drawDates(); drawPts(); drawDet(sel); }
      else { document.getElementById('update-info').textContent = "Affichage actif"; }
    }).catch(() => { document.getElementById('update-info').textContent = "Affichage actif"; });
  </script>
</body>
</html>
