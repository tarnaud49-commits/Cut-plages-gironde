<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Érosion Littorale Gironde — Prévisions 7 jours</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #0f172a; color: #f8fafc; }
    header { background: #1e293b; padding: 10px 16px; border-bottom: 1px solid #334155; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
    header h1 { font-size: 1.05rem; font-weight: 700; color: #38bdf8; }
    header p { font-size: 0.76rem; color: #94a3b8; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; background: #0f172a; border-bottom: 1px solid #1e293b; }
    .btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: 0.78rem; white-space: nowrap; }
    .btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: 600; }
    .btn-zoom.active { background: #0d9488; border-color: #2dd4bf; color: #fff; }
    .main-container { display: flex; flex: 1; overflow: hidden; }
    .map-wrapper { flex: 1; position: relative; background: #0c4a6e; overflow: hidden; cursor: grab; }
    .map-wrapper:active { cursor: grabbing; }
    #coast-map { width: 100%; height: 100%; }
    .zoom-controls { position: absolute; bottom: 14px; left: 14px; display: flex; gap: 6px; z-index: 10; }
    .zoom-controls button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; font-size: 1.1rem; cursor: pointer; }
    .sidebar { width: 375px; background: #1e293b; border-left: 1px solid #334155; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .legend { display: flex; gap: 12px; font-size: 0.76rem; background: #0f172a; padding: 7px 12px; border-radius: 8px; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #22c55e; }
    .dot-blue { background: #38bdf8; animation: pulseDot 1.1s infinite; }
    .dot-red { background: #ef4444; animation: pulseDot 0.9s infinite; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 14px; }
    .card h2 { font-size: 1rem; margin-bottom: 6px; color: #f8fafc; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; margin-bottom: 8px; }
    .badge-safe { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid #22c55e; }
    .badge-cut { background: rgba(56,189,248,0.18); color: #38bdf8; border: 1px solid #0284c7; }
    .badge-dune { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid #ef4444; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .metric { background: #1e293b; padding: 8px 10px; border-radius: 6px; }
    .metric label { display: block; font-size: 0.68rem; color: #94a3b8; }
    .metric strong { font-size: 0.9rem; color: #f1f5f9; }
    .profile-box { margin-top: 10px; background: #1e293b; border-radius: 8px; padding: 10px; }
    @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(1.3); } }
    @keyframes svgPulse { 0% { opacity: 0.95; } 50% { opacity: 0.1; } 100% { opacity: 0.95; } }
    .pulse-ring { animation: svgPulse 1s infinite ease-in-out; }
    .plage-point { cursor: pointer; }
    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .map-wrapper { height: 52vh; }
      .sidebar { width: 100%; height: 48vh; border-left: none; border-top: 1px solid #334155; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Vigilance Érosion — Littoral Girondin (28 Secteurs)</h1>
      <p id="update-info">Synchronisation en cours...</p>
    </div>
    <div class="legend">
      <span><i class="dot dot-green"></i> Stable</span>
      <span><i class="dot dot-blue"></i> Cut d'estran</span>
      <span><i class="dot dot-red"></i> Attaque dune</span>
    </div>
  </header>

  <div class="toolbar" id="date-bar"></div>
  <div class="toolbar" id="zoom-bar"></div>

  <div class="main-container">
    <div class="map-wrapper" id="map-wrapper">
      <svg id="coast-map" viewBox="0 0 420 650" preserveAspectRatio="xMidYMid meet">
        <rect x="-200" y="-200" width="820" height="1050" fill="#0c4a6e" />
        <text x="16" y="300" fill="#38bdf8" opacity="0.28" font-size="14" font-weight="700" letter-spacing="2">OCÉAN ATLANTIQUE</text>
        <text x="195" y="42" fill="#7dd3fc" opacity="0.6" font-size="10" font-weight="600">Estuaire de la Gironde</text>
        <path d="M 192,48 L 225,52 L 420,170 L 420,650 L 118,650 L 122,535 L 138,500 L 155,495 L 185,510 L 210,495 L 205,460 L 175,450 L 145,470 L 136,498 L 130,470 L 145,355 L 160,245 L 175,135 L 186,65 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
        <ellipse cx="182" cy="195" rx="9" ry="26" fill="#0284c7" opacity="0.55" />
        <ellipse cx="174" cy="285" rx="7" ry="15" fill="#0284c7" opacity="0.55" />
        <path d="M 145,470 Q 175,450 205,460 Q 210,495 185,510 Q 155,495 145,470 Z" fill="#0284c7" opacity="0.7" />
        <text x="150" y="487" fill="#e0f2fe" font-size="8.5" font-weight="600">Bassin d'Arcachon</text>
        <ellipse cx="152" cy="580" rx="8" ry="16" fill="#0284c7" opacity="0.55" />
        <g id="markers-group"></g>
      </svg>
      <div class="zoom-controls">
        <button onclick="zoomStep(0.75)" title="Zoomer">+</button>
        <button onclick="zoomStep(1.33)" title="Dézoomer">−</button>
        <button onclick="setViewBox(0, 0, 420, 650, 'global')" title="Vue globale">↺</button>
      </div>
    </div>
    <aside class="sidebar">
      <div class="card" id="detail-card">
        <h2>Sélectionnez une plage</h2>
        <p style="font-size:0.84rem;color:#94a3b8;">Cliquez sur un point de la carte pour consulter le diagnostic.</p>
      </div>
    </aside>
  </div>

  <script>
    const PLAGES_META = {
      verdon: { nom: "Le Verdon (Pointe de Grave)", short: "Pointe de Grave", fallback: "verdon", lat: 45.568, lon: -1.085, berme: 2.90, dune: 4.20 },
      soulac: { nom: "Soulac-sur-Mer", short: "Soulac", fallback: "soulac", lat: 45.515, lon: -1.132, berme: 2.85, dune: 4.10 },
      "amélie": { nom: "Soulac (L'Amélie)", short: "L'Amélie", fallback: "amélie", lat: 45.485, lon: -1.142, berme: 2.85, dune: 4.15 },
      montalivet: { nom: "Vendays-Montalivet", short: "Montalivet", fallback: "montalivet", lat: 45.378, lon: -1.161, berme: 3.00, dune: 4.45 },
      hourtin: { nom: "Hourtin Plage", short: "Hourtin", fallback: "hourtin", lat: 45.221, lon: -1.178, berme: 3.10, dune: 4.70 },
      carcans: { nom: "Carcans Plage", short: "Carcans", fallback: "carcans", lat: 45.085, lon: -1.192, berme: 3.15, dune: 4.80 },
      lacanau_lion: { nom: "Lacanau — Le Lion", short: "Le Lion", fallback: "lacanau", lat: 45.035, lon: -1.196, berme: 3.10, dune: 4.70 },
      lacanau_nord: { nom: "Lacanau — Plage Nord", short: "Lacanau Nord", fallback: "lacanau", lat: 45.016, lon: -1.199, berme: 3.05, dune: 4.60 },
      lacanau_centrale: { nom: "Lacanau — Plage Centrale", short: "Lacanau Centrale", fallback: "lacanau", lat: 45.002, lon: -1.201, berme: 3.00, dune: 4.55 },
      lacanau_sud: { nom: "Lacanau — Plage Sud", short: "Lacanau Sud", fallback: "lacanau", lat: 44.991, lon: -1.203, berme: 3.05, dune: 4.65 },
      lacanau_ecureuils: { nom: "Lacanau — Les Écureuils", short: "Les Écureuils", fallback: "lacanau", lat: 44.978, lon: -1.205, berme: 3.10, dune: 4.75 },
      lacanau_supersud: { nom: "Lacanau — Super Sud", short: "Super Sud", fallback: "lacanau", lat: 44.962, lon: -1.208, berme: 3.15, dune: 4.85 },
      lacanau_alexandre: { nom: "Lacanau — La Alexandre", short: "La Alexandre", fallback: "lacanau", lat: 44.938, lon: -1.211, berme: 3.18, dune: 4.95 },
      porge_gressier: { nom: "Le Porge — Le Gressier", short: "Le Gressier", fallback: "leporge", lat: 44.915, lon: -1.212, berme: 3.20, dune: 5.00 },
      porge_centrale: { nom: "Le Porge — Plage Centrale", short: "Le Porge Centrale", fallback: "leporge", lat: 44.892, lon: -1.215, berme: 3.20, dune: 5.05 },
      porge_jenny: { nom: "Le Porge — La Jenny", short: "La Jenny", fallback: "leporge", lat: 44.862, lon: -1.219, berme: 3.18, dune: 4.95 },
      grand_crohot: { nom: "Lège — Le Grand Crohot", short: "Grand Crohot", fallback: "lege", lat: 44.812, lon: -1.226, berme: 3.15, dune: 4.90 },
      truc_vert: { nom: "Cap Ferret — Le Truc Vert", short: "Truc Vert", fallback: "lege", lat: 44.738, lon: -1.239, berme: 3.10, dune: 4.75 },
      garonne: { nom: "Cap Ferret — La Garonne", short: "La Garonne", fallback: "lege", lat: 44.705, lon: -1.245, berme: 3.05, dune: 4.65 },
      torchere: { nom: "Cap Ferret — La Torchère", short: "La Torchère", fallback: "lege", lat: 44.675, lon: -1.251, berme: 3.00, dune: 4.55 },
      horizon: { nom: "Cap Ferret — L'Horizon", short: "L'Horizon", fallback: "lege", lat: 44.645, lon: -1.256, berme: 2.95, dune: 4.50 },
      dunes_ferret: { nom: "Cap Ferret — Les Dunes", short: "Les Dunes", fallback: "lege", lat: 44.622, lon: -1.254, berme: 2.90, dune: 4.40 },
      pointe_ferret: { nom: "Cap Ferret — La Pointe", short: "La Pointe", fallback: "lege", lat: 44.602, lon: -1.248, berme: 2.80, dune: 4.25 },
      petit_nice: { nom: "Pyla-sur-Mer — Le Petit Nice", short: "Le Petit Nice", fallback: "pilat", lat: 44.572, lon: -1.226, berme: 2.80, dune: 4.25 },
      la_lagune: { nom: "Pyla-sur-Mer — La Lagune", short: "La Lagune", fallback: "pilat", lat: 44.552, lon: -1.233, berme: 2.85, dune: 4.35 },
      salie_nord: { nom: "La Teste — La Salie Nord", short: "La Salie Nord", fallback: "pilat", lat: 44.532, lon: -1.240, berme: 2.90, dune: 4.40 },
      salie_sud: { nom: "La Teste — La Salie Sud", short: "La Salie Sud", fallback: "pilat", lat: 44.512, lon: -1.245, berme: 2.95, dune: 4.45 },
      biscarrosse: { nom: "Biscarrosse Plage", short: "Biscarrosse", fallback: "biscarrosse", lat: 44.448, lon: -1.254, berme: 3.05, dune: 4.60 }
    };
        const ZOOM_ZONES = Array.of(
      { id: "global", label: "Vue globale", vb: "0 0 420 650" },
      { id: "medoc_nord", label: "Nord Médoc", vb: "90 35 230 155" },
      { id: "lacanau", label: "Lacanau (7 plages)", vb: "75 262 195 105" },
      { id: "leporge", label: "Le Porge (3 plages)", vb: "70 325 195 95" },
      { id: "cap_ferret", label: "Cap Ferret (7 plages)", vb: "55 385 205 140" },
      { id: "pyla", label: "Pyla & La Salie (4 plages)", vb: "65 475 195 100" },
      { id: "biscarrosse", label: "Biscarrosse", vb: "65 535 195 100" }
    );

    let beachesData = {}, datesList = [], selectedDayIndex = 0, selectedBeachKey = "lacanau_centrale", activeZoomId = "global", currentVB = { x: 0, y: 0, w: 420, h: 650 };

    function setViewBox(x, y, w, h, zoneId) {
      currentVB = { x, y, w, h };
      document.getElementById('coast-map').setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
      if (zoneId) { activeZoomId = zoneId; renderZoomBar(); }
      renderMarkers();
    }

    function zoomStep(factor) {
      const nw = Math.max(65, Math.min(420, currentVB.w * factor)), nh = Math.max(95, Math.min(650, currentVB.h * factor));
      setViewBox(currentVB.x + (currentVB.w - nw) / 2, currentVB.y + (currentVB.h - nh) / 2, nw, nh, null);
    }

    function geoToSvg(lat, lon) {
      return { x: Math.round((120 + ((lon - (-1.28)) / 0.23) * 80) * 10) / 10, y: Math.round((55 + ((45.58 - lat) / 1.16) * 555) * 10) / 10 };
    }

    function formatDateFr(isoDate) {
      const d = new Date(isoDate + 'T12:00:00');
      return isNaN(d) ? isoDate : d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function initDefaultForecasts() {
      const today = new Date();
      datesList = Array.from({length: 7}, (_, i) => { const d = new Date(today); d.setDate(today.getDate() + i); return d.toISOString().slice(0, 10); });
      const coeffs = Array.of(60, 72, 83, 92, 97, 98, 94);
      Object.keys(PLAGES_META).forEach(k => {
        beachesData[k] = datesList.map((dt, idx) => ({ date: dt, hs: 2.1, tp: 11.0, waveDir: 278, wind: 28, coeff: coeffs.slice(idx, idx+1).pop() || 75, totalWater: 3.35, effectivePower: 48, duneAttack: false, cutEstran: false, status: "safe" }));
      });
    }

    function getDayData(key, idx) {
      const meta = PLAGES_META[key], firstKey = Object.keys(beachesData).slice(0, 1).pop();
      const lookup = beachesData[key] ? key : (meta && beachesData[meta.fallback] ? meta.fallback : firstKey);
      const arr = beachesData[lookup] || Array.of();
      return arr.slice(idx, idx + 1).pop() || arr.slice(0, 1).pop() || { hs: 1.8, tp: 10.5, waveDir: 280, wind: 20, coeff: 60, totalWater: 3.1, effectivePower: 35, status: "safe" };
    }

    function renderZoomBar() {
      const bar = document.getElementById('zoom-bar'); bar.innerHTML = '';
      ZOOM_ZONES.forEach(z => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-zoom' + (z.id === activeZoomId ? ' active' : '');
        btn.textContent = z.label;
        btn.onclick = () => { const p = z.vb.split(' ').map(Number); setViewBox(p.slice(0,1).pop(), p.slice(1,2).pop(), p.slice(2,3).pop(), p.slice(3,4).pop(), z.id); };
        bar.appendChild(btn);
      });
    }

    function renderDateBar() {
      const bar = document.getElementById('date-bar'); bar.innerHTML = '';
      datesList.forEach((d, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn' + (idx === selectedDayIndex ? ' active' : '');
        btn.textContent = idx === 0 ? `Aujourd'hui (${formatDateFr(d)})` : formatDateFr(d);
        btn.onclick = () => { selectedDayIndex = idx; renderDateBar(); renderMarkers(); renderDetail(selectedBeachKey); };
        bar.appendChild(btn);
      });
    }

    function renderMarkers() {
      const group = document.getElementById('markers-group'); group.innerHTML = '';
      const scale = currentVB.w / 420, rBase = Math.max(1.7, 5.0 * scale), fontSize = Math.max(3.4, 8.5 * scale);
      Object.keys(PLAGES_META).forEach(key => {
        const meta = PLAGES_META[key], prev = getDayData(key, selectedDayIndex), pos = geoToSvg(meta.lat, meta.lon);
        const isDune = prev.duneAttack || prev.status === 'dune', isCut = !isDune && (prev.cutEstran || prev.status === 'cut');
        const color = isDune ? '#ef4444' : (isCut ? '#38bdf8' : '#22c55e'), isSelected = key === selectedBeachKey;
        const g = document.createElementNS('http://w3.org', 'g');
        g.setAttribute('class', 'plage-point');
        g.onclick = () => { selectedBeachKey = key; renderMarkers(); renderDetail(key); };
        if (isDune || isCut) {
          const ring = document.createElementNS('http://w3.org', 'circle');
          ring.setAttribute('cx', pos.x); ring.setAttribute('cy', pos.y); ring.setAttribute('r', rBase * 2.2); ring.setAttribute('fill', color); ring.setAttribute('class', 'pulse-ring');
          g.appendChild(ring);
        }
        const circle = document.createElementNS('http://w3.org', 'circle');
        circle.setAttribute('cx', pos.x); circle.setAttribute('cy', pos.y); circle.setAttribute('r', isSelected ? rBase * 1.35 : rBase);
        circle.setAttribute('fill', color); circle.setAttribute('stroke', isSelected ? '#facc15' : '#ffffff'); circle.setAttribute('stroke-width', Math.max(0.5, 1.3 * scale));
        g.appendChild(circle);
        const label = document.createElementNS('http://w3.org', 'text');
        label.setAttribute('x', pos.x + rBase * 1.8); label.setAttribute('y', pos.y + fontSize * 0.35);
        label.setAttribute('fill', isSelected ? '#facc15' : '#f1f5f9'); label.setAttribute('font-size', fontSize); label.setAttribute('font-weight', isSelected ? '700' : '500');
        label.textContent = meta.short; g.appendChild(label); group.appendChild(g);
      });
    }

    function renderDetail(key) {
      selectedBeachKey = PLAGES_META[key] ? key : "lacanau_centrale";
      const meta = PLAGES_META[selectedBeachKey], prev = getDayData(selectedBeachKey, selectedDayIndex);
      const isDune = prev.duneAttack || prev.status === 'dune', isCut = !isDune && (prev.cutEstran || prev.status === 'cut');
      let badgeHtml = `<span class="badge badge-safe">Profil stable</span>`, diagnostic = "L'énergie de la houle et le niveau d'eau restent sous les seuils critiques d'érosion.";
      if (isCut) { badgeHtml = `<span class="badge badge-cut">🔵 Risque de CUT d'estran</span>`; diagnostic = `Puissance effective élevée (${prev.effectivePower} kW/m, houle + vent onshore) : risque de creusement de baïne et formation d'une marche sur la berme (+${meta.berme}m NGF).`; }
      else if (isDune) { badgeHtml = `<span class="badge badge-dune">🔴 ALERTE ATTAQUE PIED DE DUNE</span>`; diagnostic = `Le niveau d'eau extrême (+${prev.totalWater}m NGF) atteint le pied de dune (+${meta.dune}m NGF) : risque d'entaille dunaire.`; }
      const waterY = Math.max(20, Math.min(110, 115 - (prev.totalWater * 16))), bermeY = 115 - (meta.berme * 16), duneY = 115 - (meta.dune * 16);
      document.getElementById('detail-card').innerHTML = `<h2>${meta.nom}</h2>${badgeHtml}<p style="font-size:0.82rem;color:#cbd5e1;line-height:1.4;">${diagnostic}</p><div class="grid"><div class="metric"><label>Houle (Hs / Tp)</label><strong>${prev.hs} m / ${prev.tp} s</strong></div><div class="metric"><label>Dir. Houle / Vent</label><strong>${prev.waveDir}° / ${prev.wind} km/h</strong></div><div class="metric"><label>Coeff. Marée</label><strong>${prev.coeff}</strong></div><div class="metric"><label>Niveau d'eau max</label><strong>+${prev.totalWater} m NGF</strong></div><div class="metric"><label>Cote Berme (LiDAR)</label><strong>+${meta.berme} m NGF</strong></div><div class="metric"><label>Pied de Dune (LiDAR)</label><strong>+${meta.dune} m NGF</strong></div></div><div class="profile-box"><div style="font-size:0.74rem;color:#94a3b8;margin-bottom:4px;">Profil en coupe & niveau d'eau prévu</div><svg viewBox="0 0 300 130" style="width:100%;height:130px;"><rect x="0" y="${waterY}" width="300" height="${130 - waterY}" fill="rgba(56,189,248,0.35)" /><line x1="0" y1="${waterY}" x2="260" y2="${waterY}" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" /><polygon points="0,125 140,${bermeY} 220,${duneY} 260,15 300,15 300,130 0,130" fill="#d97706" opacity="0.85" /><circle cx="140" cy="${bermeY}" r="3.5" fill="#38bdf8" /><text x="85" y="${bermeY - 6}" fill="#38bdf8" font-size="9">Berme +${meta.berme}m</text><text x="155" y="${duneY - 6}" fill="#f87171" font-size="9">Dune +${meta.dune}m</text><text x="8" y="${waterY - 4}" fill="#7dd3fc" font-size="9">Eau max +${prev.totalWater}m NGF</text></svg></div>`;
    }

    let isDragging = false, startX = 0, startY = 0; const wrapper = document.getElementById('map-wrapper');
    wrapper.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX; startY = e.clientY; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    wrapper.addEventListener('mousemove', e => { if (!isDragging) return; const dx = (e.clientX - startX) * (currentVB.w / wrapper.clientWidth), dy = (e.clientY - startY) * (currentVB.h / wrapper.clientHeight); startX = e.clientX; startY = e.clientY; setViewBox(currentVB.x - dx, currentVB.y - dy, currentVB.w, currentVB.h, null); });
    wrapper.addEventListener('wheel', e => { e.preventDefault(); zoomStep(e.deltaY > 0 ? 1.15 : 0.85); }, { passive: false });

    initDefaultForecasts(); renderZoomBar(); renderDateBar(); renderMarkers(); renderDetail(selectedBeachKey);
    fetch('data_littoral.json?t=' + Date.now()).then(r => r.ok ? r.json() : null).then(raw => {
      if (raw && raw.beaches && Object.keys(raw.beaches).length > 0) {
        beachesData = raw.beaches;
        const firstKey = Object.keys(beachesData).slice(0, 1).pop();
