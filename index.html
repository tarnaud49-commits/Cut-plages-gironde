<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Érosion Littorale Gironde — Prévisions 7 jours</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #0f172a; color: #f8fafc; }
    header { background: #1e293b; padding: 12px 18px; border-bottom: 1px solid #334155; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    header h1 { font-size: 1.1rem; font-weight: 700; color: #38bdf8; }
    header p { font-size: 0.78rem; color: #94a3b8; }
    .date-bar { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; background: #0f172a; border-bottom: 1px solid #1e293b; min-height: 48px; }
    .date-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; white-space: nowrap; }
    .date-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: 600; }
    .main-container { display: flex; flex: 1; overflow: hidden; }
    #map { flex: 1; height: 100%; min-height: 300px; z-index: 1; background: #1e293b; }
    .sidebar { width: 360px; background: #1e293b; border-left: 1px solid #334155; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .legend { display: flex; gap: 12px; font-size: 0.78rem; background: #0f172a; padding: 8px 12px; border-radius: 8px; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #22c55e; }
    .dot-yellow { background: #eab308; animation: pulseYellow 1.2s infinite; }
    .dot-red { background: #ef4444; animation: pulseRed 1s infinite; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 14px; }
    .card h2 { font-size: 1rem; margin-bottom: 6px; color: #f8fafc; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; margin-bottom: 10px; }
    .badge-stable { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid #22c55e; }
    .badge-cut { background: rgba(234,179,8,0.15); color: #facc15; border: 1px solid #eab308; }
    .badge-dune { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid #ef4444; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .metric { background: #1e293b; padding: 8px 10px; border-radius: 6px; }
    .metric label { display: block; font-size: 0.7rem; color: #94a3b8; }
    .metric strong { font-size: 0.92rem; color: #f1f5f9; }
    .profile-box { margin-top: 10px; background: #1e293b; border-radius: 8px; padding: 10px; }
    svg { width: 100%; height: 130px; }
    @keyframes pulseYellow {
      0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.85); transform: scale(1); }
      70% { box-shadow: 0 0 0 12px rgba(234, 179, 8, 0); transform: scale(1.2); }
      100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); transform: scale(1); }
    }
    @keyframes pulseRed {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.9); transform: scale(1); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); transform: scale(1.25); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); transform: scale(1); }
    }
    .marker-pin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #ffffff; cursor: pointer; }
    .marker-stable { background: #22c55e; }
    .marker-cut { background: #eab308; animation: pulseYellow 1.2s infinite; }
    .marker-dune { background: #ef4444; animation: pulseRed 1s infinite; }
    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      #map { height: 55vh; }
      .sidebar { width: 100%; height: 45vh; border-left: none; border-top: 1px solid #334155; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Vigilance Érosion — Littoral Girondin</h1>
      <p id="update-info">Initialisation de la carte...</p>
    </div>
    <div class="legend">
      <span><i class="dot dot-green"></i> Stable</span>
      <span><i class="dot dot-yellow"></i> Cut d'estran</span>
      <span><i class="dot dot-red"></i> Attaque dune</span>
    </div>
  </header>

  <div class="date-bar" id="date-bar"></div>

  <div class="main-container">
    <div id="map"></div>
    <aside class="sidebar">
      <div class="card" id="detail-card">
        <h2>Sélectionnez une plage</h2>
        <p style="font-size:0.85rem;color:#94a3b8;">Cliquez sur un point de la carte (du Verdon-sur-Mer à Biscarrosse) pour consulter le diagnostic morphodynamique et les cotes LiDAR.</p>
      </div>
    </aside>
  </div>

  <script>
    const map = L.map('map').setView(L.latLng(45.02, -1.18), 9);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 18
    }).addTo(map);

    setTimeout(() => { map.invalidateSize(); }, 300);

    let coastalData = null;
    let selectedDayIndex = 0;
    let selectedPlageId = null;
    let markersLayer = L.layerGroup().addTo(map);

    function formatDateFr(isoDate) {
      const d = new Date(isoDate + 'T12:00:00');
      return isNaN(d) ? isoDate : d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function normalizeData(raw) {
      if (raw && Array.isArray(raw.plages) && Array.isArray(raw.dates)) return raw;
      const today = new Date();
      const dates = Array.from({length: 7}, (_, i) => {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        return d.toISOString().slice(0, 10);
      });
      const src = Array.isArray(raw) ? raw : (raw.plages || raw.beaches || raw.data || raw);
const list = Array.isArray(src) ? src : Object.values(src).filter(v => v && typeof v === 'object');

      const plages = list.map((p, idx) => {
        const prevs = Array.isArray(p.previsions) ? p.previsions : dates.map((dt) => ({
          date: dt,
          coeff: p.coeff || 75,
          pm_ngf: p.pm_ngf || 2.45,
          hs: p.hs || 1.8,
          tp: p.tp || 11.0,
          wdir: p.wdir || 280,
          wind: p.wind || 22,
          eau_totale: p.eau_totale || 3.4,
          energie: p.energie || 35.6,
          statut: p.statut || 'stable'
        }));
        return {
          id: p.id || ('plage_' + idx),
          nom: p.nom || p.name || ('Secteur ' + (idx + 1)),
          lat: p.lat || p.latitude,
          lon: p.lon || p.longitude,
          berme: p.berme || 3.05,
          dune: p.dune || 4.65,
          previsions: prevs
        };
      });
      return { updated_at: raw.updated_at || new Date().toISOString(), dates, plages };
    }

    function renderDateBar() {
      const bar = document.getElementById('date-bar');
      bar.innerHTML = '';
      coastalData.dates.forEach((d, idx) => {
        const btn = document.createElement('button');
        btn.className = 'date-btn' + (idx === selectedDayIndex ? ' active' : '');
        btn.textContent = idx === 0 ? `Aujourd'hui (${formatDateFr(d)})` : formatDateFr(d);
        btn.onclick = () => {
          selectedDayIndex = idx;
          renderDateBar();
          renderMarkers();
          if (selectedPlageId) renderDetail(selectedPlageId);
        };
        bar.appendChild(btn);
      });
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      coastalData.plages.forEach(p => {
        if (!p.lat || !p.lon) return;
        const prev = p.previsions[selectedDayIndex] || p.previsions[0];
        const cls = prev.statut === 'dune' ? 'marker-dune' : (prev.statut === 'cut' ? 'marker-cut' : 'marker-stable');
        const icon = L.divIcon({
          className: '',
          html: `<div class="marker-pin ${cls}" title="${p.nom}"></div>`,
          iconSize: L.point(18, 18),
          iconAnchor: L.point(9, 9)
        });
        const m = L.marker(L.latLng(p.lat, p.lon), { icon }).addTo(markersLayer);
        m.on('click', () => {
          selectedPlageId = p.id;
          renderDetail(p.id);
        });
      });
    }

    function renderDetail(plageId) {
      const p = coastalData.plages.find(x => x.id === plageId) || coastalData.plages[0];
      if (!p) return;
      selectedPlageId = p.id;
      const prev = p.previsions[selectedDayIndex] || p.previsions[0];
      const card = document.getElementById('detail-card');

      let badgeHtml = `<span class="badge badge-stable">Profil stable</span>`;
      let diagnostic = "L'énergie de la houle et le niveau d'eau restent sous les seuils critiques d'érosion.";
      if (prev.statut === 'cut') {
        badgeHtml = `<span class="badge badge-cut">Risque de CUT d'estran</span>`;
        diagnostic = `Forte énergie incidente (${prev.energie} kW/m) et/ou dérive oblique : risque de creusement de baïne et formation d'une micro-falaise sur la berme (+${p.berme}m NGF) sans atteindre la dune.`;
      } else if (prev.statut === 'dune') {
        badgeHtml = `<span class="badge badge-dune">ALERTE ATTAQUE PIED DE DUNE</span>`;
        diagnostic = `Le niveau d'eau extrême (+${prev.eau_totale}m NGF avec run-up) atteint ou dépasse le pied de dune (+${p.dune}m NGF) : risque d'entaille dunaire.`;
      }

      const waterY = Math.max(20, Math.min(110, 115 - (prev.eau_totale * 16)));
      const bermeY = 115 - (p.berme * 16);
      const duneY = 115 - (p.dune * 16);

      card.innerHTML = `
        <h2>${p.nom}</h2>
        ${badgeHtml}
        <p style="font-size:0.82rem;color:#cbd5e1;line-height:1.4;">${diagnostic}</p>
        <div class="grid">
          <div class="metric"><label>Houle (Hs / Tp)</label><strong>${prev.hs} m / ${prev.tp} s</strong></div>
          <div class="metric"><label>Direction / Vent</label><strong>${prev.wdir}° / ${prev.wind} km/h</strong></div>
          <div class="metric"><label>Coeff. Marée</label><strong>${prev.coeff} (PM +${prev.pm_ngf}m)</strong></div>
          <div class="metric"><label>Niveau d'eau max</label><strong>+${prev.eau_totale} m NGF</strong></div>
          <div class="metric"><label>Cote Berme (LiDAR)</label><strong>+${p.berme} m NGF</strong></div>
          <div class="metric"><label>Pied de Dune (LiDAR)</label><strong>+${p.dune} m NGF</strong></div>
        </div>
        <div class="profile-box">
          <div style="font-size:0.74rem;color:#94a3b8;margin-bottom:4px;">Profil en coupe & niveau d'eau prévu</div>
          <svg viewBox="0 0 300 130">
            <rect x="0" y="${waterY}" width="300" height="${130 - waterY}" fill="rgba(56,189,248,0.35)" />
            <line x1="0" y1="${waterY}" x2="260" y2="${waterY}" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" />
            <polygon points="0,125 140,${bermeY} 220,${duneY} 260,15 300,15 300,130 0,130" fill="#d97706" opacity="0.85" />
            <circle cx="140" cy="${bermeY}" r="3.5" fill="#facc15" />
            <text x="85" y="${bermeY - 6}" fill="#facc15" font-size="9">Berme +${p.berme}m</text>
            <circle cx="220" cy="${duneY}" r="3.5" fill="#f87171" />
            <text x="155" y="${duneY - 6}" fill="#f87171" font-size="9">Dune +${p.dune}m</text>
            <text x="8" y="${waterY - 4}" fill="#7dd3fc" font-size="9">Eau max +${prev.eau_totale}m NGF</text>
          </svg>
        </div>
      `;
    }

    fetch('data_littoral.json?t=' + Date.now())
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(raw => {
        coastalData = normalizeData(raw);
        const dt = new Date(coastalData.updated_at);
        document.getElementById('update-info').textContent = `Dernière mise à jour : ${dt.toLocaleDateString('fr-FR')} à ${dt.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}`;
        renderDateBar();
        renderMarkers();
        renderDetail('lacanau');
      })
      .catch(err => {
        document.getElementById('update-info').textContent = "Erreur : " + err.message;
      });
  </script>
</body>
</html>
