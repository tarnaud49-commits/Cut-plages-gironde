<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Érosion Littorale Gironde — Prévisions 7 jours</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #0f172a; color: #f8fafc; }
    header { background: #1e293b; padding: 12px 18px; border-bottom: 1px solid #334155; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    header h1 { font-size: 1.1rem; font-weight: 700; color: #38bdf8; }
    header p { font-size: 0.78rem; color: #94a3b8; }
    .date-bar { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; background: #0f172a; border-bottom: 1px solid #1e293b; min-height: 48px; }
    .date-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; white-space: nowrap; }
    .date-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: 600; }
    .main-container { display: flex; flex: 1; overflow: hidden; }
    .map-wrapper { flex: 1; position: relative; background: #0c4a6e; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #coast-map { width: 100%; height: 100%; max-width: 680px; }
    .sidebar { width: 370px; background: #1e293b; border-left: 1px solid #334155; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .legend { display: flex; gap: 12px; font-size: 0.78rem; background: #0f172a; padding: 8px 12px; border-radius: 8px; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #22c55e; }
    .dot-yellow { background: #eab308; animation: pulseDot 1.2s infinite; }
    .dot-red { background: #ef4444; animation: pulseDot 1s infinite; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 14px; }
    .card h2 { font-size: 1rem; margin-bottom: 6px; color: #f8fafc; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; margin-bottom: 10px; }
    .badge-stable { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid #22c55e; }
    .badge-cut { background: rgba(234,179,8,0.15); color: #facc15; border: 1px solid #eab308; }
    .badge-dune { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid #ef4444; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .metric { background: #1e293b; padding: 8px 10px; border-radius: 6px; }
    .metric label { display: block; font-size: 0.7rem; color: #94a3b8; }
    .metric strong { font-size: 0.92rem; color: #f1f5f9; }
    .profile-box { margin-top: 10px; background: #1e293b; border-radius: 8px; padding: 10px; }
    @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.25); } }
    @keyframes svgPulse { 0% { opacity: 0.95; } 50% { opacity: 0.15; } 100% { opacity: 0.95; } }
    .pulse-ring { animation: svgPulse 1.1s infinite ease-in-out; }
    .plage-point { cursor: pointer; }
    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .map-wrapper { height: 52vh; }
      .sidebar { width: 100%; height: 48vh; border-left: none; border-top: 1px solid #334155; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Vigilance Érosion — Littoral Girondin</h1>
      <p id="update-info">Chargement des prévisions...</p>
    </div>
    <div class="legend">
      <span><i class="dot dot-green"></i> Stable</span>
      <span><i class="dot dot-yellow"></i> Cut d'estran</span>
      <span><i class="dot dot-red"></i> Attaque dune</span>
    </div>
  </header>
  <div class="date-bar" id="date-bar"></div>
  <div class="main-container">
    <div class="map-wrapper">
      <svg id="coast-map" viewBox="0 0 420 620" preserveAspectRatio="xMidYMid meet">
        <rect x="0" y="0" width="420" height="620" fill="#0c4a6e" />
        <text x="22" y="290" fill="#38bdf8" opacity="0.35" font-size="14" font-weight="700" letter-spacing="2">OCÉAN ATLANTIQUE</text>
        <text x="195" y="42" fill="#7dd3fc" opacity="0.6" font-size="11" font-weight="600">Estuaire de la Gironde</text>
        <path d="M 192,48 L 225,52 L 420,170 L 420,620 L 118,620 L 122,520 L 138,485 L 155,480 L 185,495 L 210,480 L 205,445 L 175,435 L 145,455 L 136,480 L 130,455 L 145,355 L 160,245 L 175,135 L 186,65 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
        <ellipse cx="182" cy="195" rx="9" ry="26" fill="#0284c7" opacity="0.55" />
        <text x="196" y="198" fill="#94a3b8" font-size="9">Lac d'Hourtin</text>
        <ellipse cx="174" cy="285" rx="7" ry="15" fill="#0284c7" opacity="0.55" />
        <text x="186" y="288" fill="#94a3b8" font-size="9">Lac de Lacanau</text>
        <path d="M 145,455 Q 175,435 205,445 Q 210,480 185,495 Q 155,480 145,455 Z" fill="#0284c7" opacity="0.7" />
        <text x="152" y="472" fill="#e0f2fe" font-size="9" font-weight="600">Bassin d'Arcachon</text>
        <ellipse cx="152" cy="565" rx="8" ry="16" fill="#0284c7" opacity="0.55" />
        <text x="165" y="568" fill="#94a3b8" font-size="9">Lac de Cazaux</text>
        <g transform="translate(35, 35)">
          <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#334155" />
          <text x="-4" y="4" fill="#38bdf8" font-size="11" font-weight="700">N</text>
        </g>
        <g id="markers-group"></g>
      </svg>
    </div>
    <aside class="sidebar">
      <div class="card" id="detail-card">
        <h2>Sélectionnez une plage</h2>
        <p style="font-size:0.85rem;color:#94a3b8;">Cliquez sur un point du littoral pour afficher le diagnostic.</p>
      </div>
    </aside>
  </div>
  <script>
    const PLAGES_META = {
      verdon: { nom: "Le Verdon (Pointe de Grave)", lat: 45.568, lon: -1.085, berme: 2.90, dune: 4.20 },
      soulac: { nom: "Soulac-sur-Mer", lat: 45.515, lon: -1.132, berme: 2.85, dune: 4.10 },
      "amélie": { nom: "Soulac (L'Amélie)", lat: 45.485, lon: -1.142, berme: 2.85, dune: 4.15 },
      montalivet: { nom: "Vendays-Montalivet", lat: 45.378, lon: -1.161, berme: 3.00, dune: 4.45 },
      hourtin: { nom: "Hourtin Plage", lat: 45.221, lon: -1.178, berme: 3.10, dune: 4.70 },
      carcans: { nom: "Carcans Plage", lat: 45.085, lon: -1.192, berme: 3.15, dune: 4.80 },
      lacanau: { nom: "Lacanau Océan", lat: 45.002, lon: -1.201, berme: 3.05, dune: 4.65 },
      leporge: { nom: "Le Porge Océan", lat: 44.895, lon: -1.214, berme: 3.20, dune: 5.05 },
      lege: { nom: "Lège (Grand Crohot)", lat: 44.812, lon: -1.226, berme: 3.15, dune: 4.90 },
      trucvert: { nom: "Cap Ferret (Truc Vert)", lat: 44.718, lon: -1.242, berme: 3.10, dune: 4.75 },
      horizon: { nom: "Cap Ferret (L'Horizon)", lat: 44.635, lon: -1.256, berme: 2.95, dune: 4.50 },
      pilat: { nom: "Pyla-sur-Mer (Pilat)", lat: 44.588, lon: -1.218, berme: 2.80, dune: 4.30 },
      biscarrosse: { nom: "Biscarrosse Plage", lat: 44.448, lon: -1.254, berme: 3.05, dune: 4.60 }
    };

    let beachesData = {};
    let datesList = [];
    let selectedDayIndex = 0;
    let selectedBeachKey = "lacanau";

    function geoToSvg(lat, lon) {
      const x = 120 + ((lon - (-1.28)) / ((-1.05) - (-1.28))) * 80;
      const y = 55 + ((45.58 - lat) / (45.58 - 44.42)) * 535;
      return { x: Math.round(x), y: Math.round(y) };
    }

    function formatDateFr(isoDate) {
      const d = new Date(isoDate + 'T12:00:00');
      return isNaN(d) ? isoDate : d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function getDayData(key, idx) {
      const arr = beachesData[key] || [];
      return arr[idx] || arr[0] || { hs: 0, tp: 0, waveDir: 280, wind: 0, coeff: 75, totalWater: 3.0, effectivePower: 0, status: "safe" };
    }

    function renderDateBar() {
      const bar = document.getElementById('date-bar');
      bar.innerHTML = '';
      datesList.forEach((d, idx) => {
        const btn = document.createElement('button');
        btn.className = 'date-btn' + (idx === selectedDayIndex ? ' active' : '');
        btn.textContent = idx === 0 ? `Aujourd'hui (${formatDateFr(d)})` : formatDateFr(d);
        btn.onclick = () => {
          selectedDayIndex = idx;
          renderDateBar();
          renderMarkers();
          renderDetail(selectedBeachKey);
        };
        bar.appendChild(btn);
      });
    }

    function renderMarkers() {
      const group = document.getElementById('markers-group');
      group.innerHTML = '';
      Object.keys(beachesData).forEach(key => {
        const meta = PLAGES_META[key] || { nom: key.toUpperCase(), lat: 45.0, lon: -1.2, berme: 3.0, dune: 4.5 };
        const prev = getDayData(key, selectedDayIndex);
        const pos = geoToSvg(meta.lat, meta.lon);
        const isDune = prev.duneAttack || prev.status === 'dune';
        const isCut = !isDune && (prev.cutEstran || prev.status === 'cut');
        const color = isDune ? '#ef4444' : (isCut ? '#eab308' : '#22c55e');
        const isSelected = key === selectedBeachKey;

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'plage-point');
        g.onclick = () => {
          selectedBeachKey = key;
          renderMarkers();
          renderDetail(key);
        };

        if (isDune || isCut) {
          const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          ring.setAttribute('cx', pos.x);
          ring.setAttribute('cy', pos.y);
          ring.setAttribute('r', '13');
          ring.setAttribute('fill', color);
          ring.setAttribute('class', 'pulse-ring');
          g.appendChild(ring);
        }

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', pos.x);
        circle.setAttribute('cy', pos.y);
        circle.setAttribute('r', isSelected ? '7.5' : '6');
        circle.setAttribute('fill', color);
        circle.setAttribute('stroke', isSelected ? '#38bdf8' : '#ffffff');
        circle.setAttribute('stroke-width', isSelected ? '2.5' : '1.5');
        g.appendChild(circle);

        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', pos.x + 12);
        label.setAttribute('y', pos.y + 3);
        label.setAttribute('fill', isSelected ? '#38bdf8' : '#e2e8f0');
        label.setAttribute('font-size', isSelected ? '10.5' : '9.5');
        label.setAttribute('font-weight', isSelected ? '700' : '500');
        label.textContent = meta.nom.split(' (')[0];
        g.appendChild(label);

        group.appendChild(g);
      });
    }

    function renderDetail(key) {
      const keys = Object.keys(beachesData);
      const validKey = beachesData[key] ? key : (keys[0] || "verdon");
      selectedBeachKey = validKey;
      const meta = PLAGES_META[validKey] || { nom: validKey, berme: 3.0, dune: 4.5 };
      const prev = getDayData(validKey, selectedDayIndex);
      const card = document.getElementById('detail-card');

      const isDune = prev.duneAttack || prev.status === 'dune';
      const isCut = !isDune && (prev.cutEstran || prev.status === 'cut');

      let badgeHtml = `<span class="badge badge-stable">Profil stable</span>`;
      let diagnostic = "L'énergie de la houle et le niveau d'eau restent sous les seuils critiques d'érosion.";
      if (isCut) {
        badgeHtml = `<span class="badge badge-cut">⚠️ Risque de CUT d'estran</span>`;
        diagnostic = `Forte puissance de houle (${prev.effectivePower} kW/m) : risque de creusement de baïne et formation d'une micro-falaise sur la berme (+${meta.berme}m NGF) sans atteindre la dune.`;
      } else if (isDune) {
        badgeHtml = `<span class="badge badge-dune">🚨 ALERTE ATTAQUE PIED DE DUNE</span>`;
        diagnostic = `Le niveau d'eau extrême (+${prev.totalWater}m NGF) atteint le pied de dune (+${meta.dune}m NGF) : risque d'entaille dunaire.`;
      }

      const waterY = Math.max(20, Math.min(110, 115 - (prev.totalWater * 16)));
      const bermeY = 115 - (meta.berme * 16);
      const duneY = 115 - (meta.dune * 16);

      card.innerHTML = `
        <h2>${meta.nom}</h2>
        ${badgeHtml}
        <p style="font-size:0.82rem;color:#cbd5e1;line-height:1.4;">${diagnostic}</p>
        <div class="grid">
          <div class="metric"><label>Houle (Hs / Tp)</label><strong>${prev.hs} m / ${prev.tp} s</strong></div>
          <div class="metric"><label>Dir. Houle / Vent</label><strong>${prev.waveDir}° / ${prev.wind} km/h</strong></div>
          <div class="metric"><label>Coeff. Marée</label><strong>${prev.coeff}</strong></div>
          <div class="metric"><label>Niveau d'eau max</label><strong>+${prev.totalWater} m NGF</strong></div>
          <div class="metric"><label>Cote Berme (LiDAR)</label><strong>+${meta.berme} m NGF</strong></div>
          <div class="metric"><label>Pied de Dune (LiDAR)</label><strong>+${meta.dune} m NGF</strong></div>
        </div>
        <div class="profile-box">
          <div style="font-size:0.74rem;color:#94a3b8;margin-bottom:4px;">Profil en coupe & niveau d'eau prévu</div>
          <svg viewBox="0 0 300 130" style="width:100%;height:130px;">
            <rect x="0" y="${waterY}" width="300" height="${130 - waterY}" fill="rgba(56,189,248,0.35)" />
            <line x1="0" y1="${waterY}" x2="260" y2="${waterY}" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" />
            <polygon points="0,125 140,${bermeY} 220,${duneY} 260,15 300,15 300,130 0,130" fill="#d97706" opacity="0.85" />
            <circle cx="140" cy="${bermeY}" r="3.5" fill="#facc15" />
            <text x="85" y="${bermeY - 6}" fill="#facc15" font-size="9">Berme +${meta.berme}m</text>
            <text x="155" y="${duneY - 6}" fill="#f87171" font-size="9">Dune +${meta.dune}m</text>
            <text x="8" y="${waterY - 4}" fill="#7dd3fc" font-size="9">Eau max +${prev.totalWater}m NGF</text>
          </svg>
        </div>
      `;
    }

    fetch('data_littoral.json?t=' + Date.now())
      .then(r => r.json())
      .then(raw => {
        beachesData = raw.beaches || {};
        const firstKey = Object.keys(beachesData)[0];
        datesList = firstKey ? beachesData[firstKey].map(d => d.date) : [];
        document.getElementById('update-info').textContent = `Mise à jour : ${raw.updated_at || "Aujourd'hui"}`;
        renderDateBar();
        renderMarkers();
        renderDetail(selectedBeachKey);
      })
      .catch(err => {
        document.getElementById('update-info').textContent = "Erreur chargement JSON : " + err.message;
      });
  </script>
</body>
</html>
